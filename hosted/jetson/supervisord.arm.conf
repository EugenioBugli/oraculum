; Robot container processes on the Jetson (arm64). Installed over /workspace/scripts/supervisord.conf by build_all.sh
; (the x86 original is kept as supervisord.conf.x86). booster-motion is a closed x86_64 binary: Box64 runs it.
; Maximus is the native aarch64 build in /workspace/build/arm (its RPATH finds /workspace/.pixi/envs/default/lib).
[supervisord]
nodaemon=true

[program:booster-motion]
; Native aarch64 booster-motion from the T1 firmware (the default) when docker_config.yaml mounts it at /opt/booster-native
; (cwd bin/: it loads lib/*.so and ../configs/T1/* relative to it); else the x86 simulation package under Box64.
; config_sim_circus.lua (BOOSTER_MOTION_RE.md): PD loop in booster-motion, IMU flag, serial-ankle bypass.
directory=/opt/booster
command=/bin/bash --norc --noprofile -c "if [ -x /opt/booster-native/bin/booster-motion ]; then cd /opt/booster-native/bin && LD_LIBRARY_PATH=/opt/booster-native/bin/lib:/opt/booster-native/fwlib exec ./booster-motion -mode sim -config /opt/booster/Gait/configs/T1/${NATIVE_CONFIG:-config_sim_circus.lua}; else exec /usr/local/bin/box64 /opt/booster/booster-motion -mode sim -config configs/config_isaac.lua; fi"
stopwaitsecs=3
autostart=true
autorestart=false
priority=1
stdout_logfile=/var/log/booster-motion.log
stderr_logfile=/var/log/booster-motion.err

[program:simbridge]
; Native booster-motion 1.8 boots in damping. circus steps the physics only once simbridge feeds it, so on the native
; path simbridge waits (max 30 s) until Maximus's boot Prepare is in effect; otherwise the robot collapses at once.
command=/bin/bash --norc --noprofile -c "if [ -x /opt/booster-native/bin/booster-motion ]; then for i in $(seq 60); do grep -q 'exec switch to prepare' /var/log/booster-motion.log 2>/dev/null && break; sleep 0.5; done; fi; exec /opt/ros/humble/bin/simbridge"
autostart=true
autorestart=false
priority=1
stdout_logfile=/var/log/simbridge.log
stderr_logfile=/var/log/simbridge.err

[program:maximus]
directory=/workspace
; SPQR_SIM_FW18=1 only with the native booster-motion 1.8: Maximus then uses kSoccer (RobocupMode) and sends Prepare at
; boot (maximus_sim_fw18.patch); the Box64 0.0.11 path keeps kWalking. The file build/USE_RELEASE selects the Release
; build in build/arm-release (build_maximus.sh with BUILD_TYPE=Release); default: the Debug build in build/arm.
command=/bin/bash --norc --noprofile -c "sleep 2 && if [ -x /opt/booster-native/bin/booster-motion ]; then export SPQR_SIM_FW18=1; fi && B=/workspace/build/arm && if [ -f /workspace/build/USE_RELEASE ]; then B=/workspace/build/arm-release; fi && exec $B/src/app/maximus_main"
autostart=true
autorestart=false
priority=2
stdout_logfile=/var/log/maximus.log
stderr_logfile=/var/log/maximus.err
