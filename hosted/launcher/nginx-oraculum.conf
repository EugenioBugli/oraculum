# /etc/nginx/sites-available/oraculum.emanuelemusumeci.com — GitHub login (oauth2-proxy :4180) in front of the
# launcher (:18100). nginx overwrites X-Auth-Request-User, so a browser cannot set it.
server {
    listen 80;
    server_name oraculum.emanuelemusumeci.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 142.93.104.36:443 ssl http2;
    server_name oraculum.emanuelemusumeci.com;
    ssl_certificate /etc/letsencrypt/live/oraculum.emanuelemusumeci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oraculum.emanuelemusumeci.com/privkey.pem;

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /oauth2/auth {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $login_user $upstream_http_x_auth_request_user;
        proxy_set_header X-Auth-Request-User $login_user;
        proxy_read_timeout 180s;   # a session start waits for Modal (~30-60 s)
        proxy_pass http://127.0.0.1:18100;
    }
    location @signin { return 302 /oauth2/start?rd=$request_uri; }
}
