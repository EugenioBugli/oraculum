# GitHub login for demo.emanuelemusumeci.com (oauth2-proxy v7.13.0). ONE app guards every public demo, each served
# under its own path (demo.emanuelemusumeci.com/<demo>). To add a demo: an nginx `location /<demo>/` with
# `auth_request /oauth2/auth` in front of that demo's backend; no oauth2-proxy change. To restrict a demo to a
# different org/team, run a second oauth2-proxy on another port and point that location at it.
# client id/secret + the cookie secret live in /opt/oraculum-launcher/*.env (mode 600).
provider = "github"
github_org = "SPQRTeam"
scope = "user:email read:org"
email_domains = ["*"]
redirect_url = "https://demo.emanuelemusumeci.com/oauth2/callback"
http_address = "127.0.0.1:4180"
reverse_proxy = true
set_xauthrequest = true
upstreams = ["static://202"]
cookie_name = "_demo_login"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "168h"
