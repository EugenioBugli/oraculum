# GitHub login for oraculum.emanuelemusumeci.com (oauth2-proxy v7.13.0). To reuse it for another project, copy this
# file and change redirect_url (that project's /oauth2/callback, also set in the GitHub OAuth app), github_org or
# github_team, and http_address. The client id/secret and the cookie secret live in /opt/oraculum-launcher/*.env.
provider = "github"
github_org = "SPQRTeam"
scope = "user:email read:org"
email_domains = ["*"]
redirect_url = "https://oraculum.emanuelemusumeci.com/oauth2/callback"
http_address = "127.0.0.1:4180"
reverse_proxy = true
set_xauthrequest = true
upstreams = ["static://202"]
cookie_name = "_oraculum_login"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "168h"
