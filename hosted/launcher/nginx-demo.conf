# /etc/nginx/sites-available/demo.emanuelemusumeci.com — one host for every public demo, each under its own path
# (demo.emanuelemusumeci.com/<demo>), one GitHub login (oauth2-proxy :4180) in front of all of them. The bare host
# redirects to the main site. oraculum is the launcher on 127.0.0.1:18100.
server {
    listen 80;
    server_name demo.emanuelemusumeci.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 142.93.104.36:443 ssl http2;
    server_name demo.emanuelemusumeci.com;
    ssl_certificate /etc/letsencrypt/live/demo.emanuelemusumeci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.emanuelemusumeci.com/privkey.pem;

    # the bare host is not a demo yet: a "work in progress" page (deploy copies hosted/launcher/web/ to /var/www/demo/)
    root /var/www/demo;
    location = / { try_files /index.html =404; }
    location = /wip.png { }
    location = /wip_alt.png { }

    # the shared GitHub login
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /oauth2/auth {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # demo: oraculum. Copy this block per demo (new path + backend); the login is shared.
    location = /oraculum { return 308 /oraculum/; }
    location /oraculum/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $login_user $upstream_http_x_auth_request_user;
        proxy_set_header X-Auth-Request-User $login_user;
        proxy_read_timeout 180s;                 # a session start waits for Modal (~30-60 s)
        proxy_pass http://127.0.0.1:18100/;      # strips /oraculum/: the launcher serves at its own root
    }
    location @signin { return 302 /oauth2/start?rd=$request_uri; }
}
