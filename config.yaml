# Field Viewer Configuration

# Which field file to load (relative to the fields/ directory)
# Options: fieldAdultSize.yaml | fieldRCAP.yaml | fieldSPL.yaml
field: fieldRCAP.yaml   # RCAP match field, 22 x 14 m (spqrbooster2026 mappazzone src/app/config/fields/fieldRCAP.yaml)

display:
  # Field surface color
  field_color: "#3a7d44"
  # Border strip between field and surroundings (distance in metres)
  border_color: "#2d6b35"
  border_width: 1.0
  # Area surrounding the field
  surround_color: "#1e3d1e"
  # Line color
  line_color: "white"
  # Goal color
  goal_color: "#cccccc"
  # Ball color
  ball_color: "white"
  # Penalty mark color (uses line_color if not set)
  penalty_mark_color: "white"

  # Show optional elements
  show_ball: true
  show_goals: true
  show_dimensions_label: true

  # Window title
  title: "Oraculum"

# Official match (HSL rules @06c44d4b, rules/robot_players.tex): true = the gateway sends NOTHING to the robots or the
# GameController. L285-287: robots act autonomously, no teleoperation or remote control of any kind; L289: communication
# only among robots, referees and the GameController. It still receives telemetry (10006, the robots' 1 packet/s debug
# data, L373-374) and listens to the GameController (3838). Every command route answers 409, ORACULUM_SIM_GC and
# ORACULUM_CONTROL_IP are ignored, /state carries "match": true and the pages disable their command controls.
# Env ORACULUM_MATCH=1 (or 0) overrides this key. Network placement: docs/wiki/Match-Mode-and-Rules.md.
match: false

frames:
  # Robots send (x, y, angle) in their own team's frame (own goal at -x). Packets from the team with this
  # colour (as DebugMessageSender sends it, lowercase) are point-mirrored into the shared field frame, where
  # it defends +x (circus world: red left, blue right). Set to "" when every sender already uses one frame
  # (e.g. spqrbooster2026 main simulation before PR #169, whose OracleBridge sends circus world coordinates).
  mirror_team_color: "blue"

socket:
  enabled: true        # set to true to receive live data via UDP
  host: "0.0.0.0"      # bind address (0.0.0.0 = all interfaces)
  port: 10006

game_controller:
  enabled: true        # set to true to receive GameController state via UDP
  host: "0.0.0.0"
  port: 3838
  own_team: 19       # set to your team number to track own team index

# Robots on ANY branch (src/reception.py). RECEIVE-ONLY: these sources send nothing, also with match: true.
# All sources run at once and merge per robot (sender IP, team, player); priority debug > team > gc.
# A robot heard only by team message or GC return is read-only (no commands). No key needed: these are the defaults.
reception:
  debug: true           # UDP socket.port (10006): DebugMessageSender JSON, our oraculum branches only (richest)
  team_messages: true   # UDP 10000 + team: SPQRMessage broadcast, formats of main and of mappazzone/RCAP2026-DEV;
                        # ports of own_team, both teams of the GameController packet and `teams` below
  gc_return: true       # UDP 3939: GameController return packets of robots that send them to this host. On a host that
                        # also runs the GameController, start the GameController first (or set false): only one gets 3939
  teams: []             # more team numbers to listen to (e.g. [5, 8]); packets in an unknown format are only counted

agents:
  count: 7      # number of animated agents
  speed: 1.5    # base speed in m/s
  colors:
    - "#822433"   # sap red rgb(130, 36, 51)
    - "#006778"   # sap blue rgb(0, 103, 120)
    - "#000000"   # black
    - "#ffffff"   # white

joystick:
  enabled: true
  target_host: "127.0.0.1"   # Use "255.255.255.255" or your wifi network's broadcast for physical robot
  target_port: 10007
  device_path: "/dev/input/js0"

drawings:
  ignored_paths:
    - "test/hidden_drawings"
    - "particles/ignored"

